<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>買い物リスト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f4f0;--white:#fff;--gray1:#f0efe9;--gray2:#e0ddd4;--gray3:#9b9890;--text:#1a1916;--text2:#6b6860;--green:#2d5a27;--green2:#e8f0e7;--red:#c0392b;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* header */
#hdr{background:var(--white);border-bottom:1px solid var(--gray2);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;}
#hdr-title{font-size:17px;font-weight:700;}
#settings-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--gray1);cursor:pointer;font-size:16px;}
/* tabs */
#tabs{background:var(--white);border-bottom:1px solid var(--gray2);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:99;padding:0 12px;}
#tabs::-webkit-scrollbar{display:none;}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:5px;}
.tab.on{color:var(--green);border-bottom-color:var(--green);}
.tab-n{background:var(--gray1);color:var(--text2);font-size:11px;padding:1px 6px;border-radius:10px;}
.tab.on .tab-n{background:var(--green2);color:var(--green);}
#tab-add{padding:10px 8px;font-size:20px;color:var(--gray3);cursor:pointer;display:flex;align-items:center;}
/* main */
#main{padding:12px 16px 120px;max-width:600px;margin:0 auto;}
/* add box */
#add-box{background:var(--white);border-radius:var(--r);border:1px solid var(--gray2);margin-bottom:12px;overflow:hidden;}
#add-row{display:flex;align-items:center;gap:8px;padding:10px 12px;}
#add-input{flex:1;border:none;background:transparent;font-size:15px;font-family:inherit;color:var(--text);outline:none;}
#add-input::placeholder{color:var(--gray3);}
#mic-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--gray1);cursor:pointer;font-size:15px;flex-shrink:0;}
#mic-btn.rec{background:#fee;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#do-add{padding:8px 18px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;flex-shrink:0;font-family:inherit;}
#aisle-row{padding:0 12px 10px;}
#aisle-sel{width:100%;border:1px solid var(--gray2);border-radius:var(--rs);padding:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--gray1);outline:none;}
#staples-toggle{padding:9px 12px;background:var(--gray1);border-top:1px solid var(--gray2);font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
#staples-panel{border-top:1px solid var(--gray2);padding:10px 12px;display:none;}
#staples-panel.open{display:block;}
#staple-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.s-cat{padding:5px 12px;border-radius:20px;border:1px solid var(--gray2);font-size:12px;cursor:pointer;background:var(--white);color:var(--text2);}
.s-cat.on{background:var(--green);color:#fff;border-color:var(--green);}
#staple-chips{display:flex;gap:6px;flex-wrap:wrap;}
.s-chip{padding:7px 14px;border-radius:20px;border:1px solid var(--gray2);font-size:13px;cursor:pointer;background:var(--white);}
.s-chip:active{background:var(--green2);}
/* aisle section */
.a-sec{margin-bottom:8px;border-radius:var(--r);overflow:hidden;border:1px solid var(--gray2);background:var(--white);}
.a-hdr{padding:11px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.a-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.a-lbl{font-size:13px;font-weight:600;flex:1;}
.a-cnt{font-size:12px;color:var(--gray3);}
.a-chev{font-size:11px;color:var(--gray3);transition:transform .2s;}
.a-sec.col .a-chev{transform:rotate(-90deg);}
.a-sec.col .a-body{display:none;}
.a-prog{height:3px;background:var(--gray2);}
.a-prog-fill{height:100%;transition:width .3s;}
/* item */
.iw{position:relative;overflow:hidden;border-top:1px solid var(--gray2);}
.del-bg{position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;cursor:pointer;user-select:none;}
.si{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--white);transition:transform .2s;position:relative;touch-action:pan-y;user-select:none;}
.si.faded{opacity:.4;}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--gray2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.chk.done{background:var(--green);border-color:var(--green);color:#fff;}
.iname{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iname.done{text-decoration:line-through;color:var(--gray3);}
.qty-c{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qbtn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gray2);background:var(--gray1);color:var(--text);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;}
.qbtn:active{background:var(--gray2);}
.qnum{font-size:14px;min-width:26px;text-align:center;cursor:pointer;padding:3px 0;border-bottom:1px dashed var(--gray2);}
/* empty */
.empty{text-align:center;padding:48px 24px;color:var(--gray3);}
/* undo */
#undo-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:500;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
#undo-bar.show{opacity:1;pointer-events:all;}
#undo-btn{color:#7dd87d;font-weight:700;cursor:pointer;border:none;background:transparent;font-size:13px;}
/* settings */
#settings{display:none;padding:12px 16px 80px;max-width:600px;margin:0 auto;}
#settings.show{display:block;}
#main-wrap.hide{display:none;}
.set-card{background:var(--white);border-radius:var(--r);border:1px solid var(--gray2);margin-bottom:12px;overflow:hidden;}
.set-grp{border-top:1px solid var(--gray2);padding:10px 14px;font-size:13px;font-weight:600;background:var(--gray1);display:flex;align-items:center;gap:8px;}
.set-grp:first-child{border-top:none;}
.set-row{display:flex;align-items:center;gap:8px;padding:13px 14px;border-top:1px solid var(--gray2);}
.set-name{flex:1;font-size:14px;}
.set-meta{font-size:12px;color:var(--gray3);}
.set-add{padding:13px 14px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--gray2);cursor:pointer;color:var(--green);font-size:13px;font-weight:500;}
.ebtn{border:none;background:transparent;cursor:pointer;font-size:14px;padding:4px 6px;color:var(--text2);}
.dbtn{border:none;background:transparent;cursor:pointer;font-size:15px;padding:4px 8px;color:var(--red);font-weight:700;}
.back{font-size:13px;color:var(--green);cursor:pointer;}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:600px;padding:20px 20px 44px;transform:translateY(16px);transition:transform .2s;}
.ov.open .modal{transform:translateY(0);}
.m-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.m-label{font-size:12px;color:var(--text2);margin-bottom:5px;}
.m-field{margin-bottom:12px;}
.m-inp{width:100%;border:1px solid var(--gray2);border-radius:var(--rs);padding:10px 12px;font-size:15px;font-family:inherit;outline:none;background:var(--gray1);}
.m-inp:focus{border-color:var(--green);}
.cp{display:flex;gap:8px;flex-wrap:wrap;}
.csw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.csw.on{border-color:#333;}
.m-acts{display:flex;gap:8px;margin-top:16px;}
.mbtn{flex:1;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;border:1px solid var(--gray2);background:var(--gray1);color:var(--text);}
.mbtn-p{background:var(--green);color:#fff;border-color:var(--green);}
/* qty modal */
#qty-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:250;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s;}
#qty-ov.open{opacity:1;pointer-events:all;}
#qty-box{background:var(--white);border-radius:var(--r);padding:24px 20px;width:200px;text-align:center;}
#qty-item-name{font-size:13px;color:var(--text2);margin-bottom:12px;}
#qty-inp{width:100%;border:1px solid var(--gray2);border-radius:var(--rs);padding:10px;font-size:24px;text-align:center;outline:none;font-family:inherit;}
#qty-inp:focus{border-color:var(--green);}
#qty-ok{margin-top:12px;width:100%;padding:10px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;}
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-left"><span id="hdr-title">🛒 買い物リスト</span></div>
  <button id="settings-btn">⚙️</button>
</div>

<div id="main-wrap">
  <div id="tabs"><div id="tab-add">＋</div></div>
  <div id="main"></div>
</div>

<div id="settings">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-top:4px;">
    <span class="back" id="back-btn">← 戻る</span>
    <span style="font-size:16px;font-weight:700;">設定</span>
  </div>
  <div style="font-size:12px;color:var(--text2);margin-bottom:6px;">スーパー・売り場</div>
  <div class="set-card" id="store-settings"></div>
  <div style="font-size:12px;color:var(--text2);margin:16px 0 6px;">定番リスト</div>
  <div class="set-card" id="staple-settings"></div>
</div>

<!-- Aisle modal -->
<div class="ov" id="aisle-ov">
  <div class="modal">
    <div class="m-title" id="aisle-m-title">売り場を追加</div>
    <div class="m-field"><div class="m-label">売り場名</div><input class="m-inp" id="aisle-name-inp" placeholder="例：野菜・果物"></div>
    <div class="m-field"><div class="m-label">色</div><div class="cp" id="cp"></div></div>
    <div class="m-field"><div class="m-label">並び順（小さいほど上）</div><input class="m-inp" id="aisle-sort-inp" type="number" value="1"></div>
    <div class="m-acts">
      <button class="mbtn" onclick="closeOv('aisle-ov')">キャンセル</button>
      <button class="mbtn mbtn-p" onclick="saveAisle()">保存</button>
    </div>
  </div>
</div>

<!-- Store modal -->
<div class="ov" id="store-ov">
  <div class="modal">
    <div class="m-title">スーパーを追加</div>
    <div class="m-field"><div class="m-label">スーパー名</div><input class="m-inp" id="store-name-inp" placeholder="例：業務スーパー"></div>
    <div class="m-acts">
      <button class="mbtn" onclick="closeOv('store-ov')">キャンセル</button>
      <button class="mbtn mbtn-p" onclick="saveStore()">保存</button>
    </div>
  </div>
</div>

<!-- Staple modal -->
<div class="ov" id="staple-ov">
  <div class="modal">
    <div class="m-title" id="staple-m-title">定番アイテムを追加</div>
    <div class="m-field"><div class="m-label">アイテム名</div><input class="m-inp" id="staple-name-inp" placeholder="例：玉ねぎ"></div>
    <div class="m-field"><div class="m-label">売り場</div><select class="m-inp" id="staple-aisle-inp"></select></div>
    <div class="m-field"><div class="m-label">並び順（小さいほど上）</div><input class="m-inp" id="staple-sort-inp" type="number" value="1"></div>
    <div class="m-acts">
      <button class="mbtn" onclick="closeOv('staple-ov')">キャンセル</button>
      <button class="mbtn mbtn-p" onclick="saveStaple()">保存</button>
    </div>
  </div>
</div>

<!-- Qty modal -->
<div id="qty-ov">
  <div id="qty-box">
    <div id="qty-item-name">数量</div>
    <input id="qty-inp" type="number" min="1" value="1">
    <button id="qty-ok" onclick="saveQty()">OK</button>
  </div>
</div>

<!-- Undo bar -->
<div id="undo-bar"><span id="undo-msg">削除しました</span><button id="undo-btn" onclick="doUndo()">元に戻す</button></div>

<script>
const SB = supabase.createClient(
  'https://pfobhvsslpxuiglfacss.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmb2JodnNzbHB4dWlnbGZhY3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODg4NzIsImV4cCI6MjA5Mjg2NDg3Mn0.yyYgQnDrT2OTgKHsTtNPbNLesMUd_mGYlqZlU6mLZQE'
);
const COLORS = ['#e74c3c','#e67e22','#f39c12','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#795548','#607d8b'];

// --- State ---
var stores=[], aisles=[], staples=[], items=[];
var activeStore=null;
var editAisleId=null, aisleStoreId=null;
var editStapleId=null;
var qtyItemId=null;
var staplesOpen=false, staplesCat=null;
var isRec=false, recog=null;
var undoItem=null, undoTimer=null;
var skipRT=false;

// --- Boot ---
async function boot() {
  await reload();
  SB.channel('c1').on('postgres_changes',{event:'*',schema:'public'}, function(){
    if(!skipRT){ reload().then(function(){ drawAll(); }); }
  }).subscribe();
  drawAll();
}

async function reload() {
  var r = await Promise.all([
    SB.from('stores').select('*'),
    SB.from('aisles').select('*').order('sort_order'),
    SB.from('staples').select('*').order('sort_order'),
    SB.from('shopping_items').select('*').order('created_at')
  ]);
  stores  = r[0].data || [];
  aisles  = r[1].data || [];
  staples = r[2].data || [];
  items   = r[3].data || [];
  if (!activeStore && stores.length) activeStore = stores[0].id;
}

function pause(ms) { skipRT=true; setTimeout(function(){ skipRT=false; }, ms||2000); }

// --- Draw ---
function drawAll() { drawTabs(); drawMain(); if(document.getElementById('settings').classList.contains('show')) drawSettings(); }

function drawTabs() {
  var el = document.getElementById('tabs');
  var h = '';
  for (var i=0; i<stores.length; i++) {
    var s = stores[i];
    var n = 0;
    for (var j=0; j<items.length; j++) { if(items[j].store_id===s.id && !items[j].checked) n++; }
    var badge = n ? '<span class="tab-n">'+n+'</span>' : '';
    var on = s.id===activeStore ? ' on' : '';
    h += '<div class="tab'+on+'" onclick="setStore(\''+s.id+'\')">'+s.name+badge+'</div>';
  }
  h += '<div id="tab-add" onclick="openOv(\'store-ov\')">＋</div>';
  el.innerHTML = h;
}

function drawMain() {
  var el = document.getElementById('main');
  if (!activeStore) {
    el.innerHTML = '<div class="empty">⚙️設定からスーパーを追加してください</div>';
    return;
  }
  var sa = aisles.filter(function(a){ return a.store_id===activeStore; });
  var si = items.filter(function(i){ return i.store_id===activeStore; });
  var ss = staples.filter(function(s){
    for(var i=0;i<sa.length;i++){ if(sa[i].id===s.aisle_id) return true; } return false;
  });

  var h = '';
  // Add box
  h += '<div id="add-box">';
  h += '<div id="add-row">';
  h += '<input id="add-input" placeholder="アイテムを追加..." onkeydown="if(event.key===\'Enter\')doAdd()">';
  h += '<button id="mic-btn" class="'+(isRec?'rec':'')+'" onclick="toggleMic()">🎤</button>';
  h += '<button id="do-add" onclick="doAdd()">追加</button>';
  h += '</div>';
  h += '<div id="aisle-row"><select id="aisle-sel"><option value="">売り場（未分類）</option>';
  for(var i=0;i<sa.length;i++) h += '<option value="'+sa[i].id+'">'+sa[i].name+'</option>';
  h += '</select></div>';
  h += '<div id="staples-toggle" onclick="toggleStaples()"><span>📋 定番リストから追加</span><span>'+(staplesOpen?'▲':'▼')+'</span></div>';
  h += '<div id="staples-panel"'+(staplesOpen?' class="open"':'')+'>';
  h += '<div id="staple-cats">';
  h += '<div class="s-cat'+(staplesCat===null?' on':'')+'" onclick="setCat(null)">すべて</div>';
  for(var i=0;i<sa.length;i++){
    var a=sa[i];
    var on=staplesCat===a.id;
    var style=on?'background:'+a.color+';border-color:'+a.color+';color:#fff':'color:'+a.color+';border-color:'+a.color+'40';
    h += '<div class="s-cat'+(on?' on':'')+'" style="'+style+'" onclick="setCat(\''+a.id+'\')">'+a.name+'</div>';
  }
  h += '</div><div id="staple-chips">';
  var filtered = ss.filter(function(s){ return staplesCat===null || s.aisle_id===staplesCat; });
  if(filtered.length===0) h += '<span style="color:var(--gray3);font-size:13px;">定番アイテムがありません</span>';
  for(var i=0;i<filtered.length;i++) h += '<div class="s-chip" onclick="addFromStaple(\''+filtered[i].id+'\')">'+filtered[i].name+'</div>';
  h += '</div></div></div>';

  // Items
  if (si.length===0) {
    h += '<div class="empty">リストは空です ✅</div>';
  } else {
    // By aisle
    for(var ai=0;ai<sa.length;ai++){
      var aisle=sa[ai];
      var ait=si.filter(function(it){ return it.aisle_id===aisle.id; });
      if(!ait.length) continue;
      var done=ait.filter(function(it){return it.checked;}).length;
      var pct=Math.round(done/ait.length*100);
      h += '<div class="a-sec" id="sec-'+aisle.id+'">';
      h += '<div class="a-hdr" style="background:'+aisle.color+'12" onclick="togSec(\''+aisle.id+'\')">';
      h += '<div class="a-dot" style="background:'+aisle.color+'"></div>';
      h += '<div class="a-lbl">'+aisle.name+'</div>';
      h += '<div class="a-cnt">'+done+'/'+ait.length+'</div>';
      h += '<div class="a-chev">▾</div></div>';
      h += '<div class="a-prog"><div class="a-prog-fill" style="width:'+pct+'%;background:'+aisle.color+'60"></div></div>';
      h += '<div class="a-body">';
      for(var ii=0;ii<ait.length;ii++) h += itemHTML(ait[ii]);
      h += '</div></div>';
    }
    // Uncategorized
    var noA=si.filter(function(it){return !it.aisle_id;});
    if(noA.length){
      h += '<div class="a-sec" id="sec-none">';
      h += '<div class="a-hdr" style="background:#f0f0f0" onclick="togSec(\'none\')">';
      h += '<div class="a-dot" style="background:#999"></div>';
      h += '<div class="a-lbl">未分類</div>';
      h += '<div class="a-cnt">'+noA.length+'</div>';
      h += '<div class="a-chev">▾</div></div>';
      h += '<div class="a-body">';
      for(var ii=0;ii<noA.length;ii++) h += itemHTML(noA[ii]);
      h += '</div></div>';
    }
  }

  el.innerHTML = h;
  attachSwipe();
}

function itemHTML(it) {
  var h = '<div class="iw" id="iw-'+it.id+'">';
  if (!it.checked) {
    h += '<div class="del-bg" onclick="delItem(\''+it.id+'\')">削除</div>';
  }
  h += '<div class="si'+(it.checked?' faded':'')+'" id="si-'+it.id+'">';
  h += '<div class="chk'+(it.checked?' done':'')+'" onclick="togChk(\''+it.id+'\')">'+( it.checked?'✓':'' )+'</div>';
  h += '<div class="iname'+(it.checked?' done':'\'")>'+it.name+'</div>';
  if (!it.checked) {
    h += '<div class="qty-c">';
    h += '<button class="qbtn" onclick="chgQty(\''+it.id+'\',-1)">−</button>';
    h += '<div class="qnum" onclick="openQty(\''+it.id+'\',\''+it.name.replace(/'/g,'&#39;')+'\','+it.quantity+')">'+it.quantity+'</div>';
    h += '<button class="qbtn" onclick="chgQty(\''+it.id+'\',1)">＋</button>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

// Swipe to delete
function attachSwipe() {
  var els = document.querySelectorAll('.si:not(.faded)');
  for (var i=0;i<els.length;i++) {
    (function(el){
      var sx=0, sy=0, dx=0, swiped=false;
      el.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; swiped=el.classList.contains('sw'); }, {passive:true});
      el.addEventListener('touchmove', function(e){
        dx=e.touches[0].clientX-sx;
        var dy=Math.abs(e.touches[0].clientY-sy);
        if(dy>Math.abs(dx)) return;
        var mv=swiped?Math.min(0,Math.max(-88,-88+dx)):Math.max(-88,Math.min(0,dx));
        el.style.transition='none'; el.style.transform='translateX('+mv+'px)';
      },{passive:true});
      el.addEventListener('touchend', function(){
        el.style.transition='transform .2s';
        if(!swiped&&dx<-44){ el.style.transform='translateX(-88px)'; el.classList.add('sw'); swiped=true; }
        else if(swiped&&dx>44){ el.style.transform='translateX(0)'; el.classList.remove('sw'); swiped=false; }
        else { el.style.transform=swiped?'translateX(-88px)':'translateX(0)'; }
      });
    })(els[i]);
  }
}

// --- Actions ---
function setStore(id) { activeStore=id; drawAll(); }
function toggleStaples() { staplesOpen=!staplesOpen; drawMain(); }
function setCat(id) { staplesCat=id; drawMain(); }
function togSec(id) { var el=document.getElementById('sec-'+id); if(el) el.classList.toggle('col'); }

async function doAdd() {
  var inp = document.getElementById('add-input');
  var name = inp.value.trim();
  if (!name || !activeStore) return;
  var aid = document.getElementById('aisle-sel').value || null;

  pause(2000);
  var r = await SB.from('shopping_items').insert({store_id:activeStore,aisle_id:aid,name:name,quantity:1,checked:false}).select().single();
  if (r.data) items.push(r.data);

  if (aid) {
    var already=false;
    for(var i=0;i<staples.length;i++){ if(staples[i].name===name && staples[i].aisle_id===aid){ already=true; break; } }
    if (!already) {
      var mx=0;
      for(var i=0;i<staples.length;i++){ if(staples[i].aisle_id===aid && (staples[i].sort_order||0)>mx) mx=staples[i].sort_order||0; }
      var sr = await SB.from('staples').insert({aisle_id:aid,name:name,sort_order:mx+1}).select().single();
      if (sr.data) staples.push(sr.data);
    }
  }
  inp.value = '';
  drawAll();
}

async function addFromStaple(sid) {
  var s=null;
  for(var i=0;i<staples.length;i++){ if(staples[i].id===sid){ s=staples[i]; break; } }
  if(!s||!activeStore) return;
  pause(2000);
  var ex=null;
  for(var i=0;i<items.length;i++){ if(items[i].store_id===activeStore&&items[i].name===s.name&&!items[i].checked){ ex=items[i]; break; } }
  if(ex){
    await SB.from('shopping_items').update({quantity:ex.quantity+1}).eq('id',ex.id);
    ex.quantity++;
  } else {
    var r=await SB.from('shopping_items').insert({store_id:activeStore,aisle_id:s.aisle_id,name:s.name,quantity:1,checked:false}).select().single();
    if(r.data) items.push(r.data);
  }
  drawAll();
}

async function togChk(id) {
  var it=null;
  for(var i=0;i<items.length;i++){ if(items[i].id===id){ it=items[i]; break; } }
  if(!it) return;
  pause(2000);
  await SB.from('shopping_items').update({checked:!it.checked}).eq('id',id);
  it.checked=!it.checked;
  drawAll();
}

async function chgQty(id, d) {
  var it=null;
  for(var i=0;i<items.length;i++){ if(items[i].id===id){ it=items[i]; break; } }
  if(!it) return;
  var nq=Math.max(1,it.quantity+d);
  pause(2000);
  await SB.from('shopping_items').update({quantity:nq}).eq('id',id);
  it.quantity=nq;
  drawAll();
}

async function delItem(id) {
  var it=null;
  for(var i=0;i<items.length;i++){ if(items[i].id===id){ it=items[i]; break; } }
  if(!it) return;
  undoItem={id:it.id,store_id:it.store_id,aisle_id:it.aisle_id,name:it.name,quantity:it.quantity,checked:it.checked};
  pause(2000);
  await SB.from('shopping_items').delete().eq('id',id);
  items=items.filter(function(i){ return i.id!==id; });
  drawAll();
  if(undoTimer) clearTimeout(undoTimer);
  document.getElementById('undo-msg').textContent='「'+it.name+'」を削除';
  document.getElementById('undo-bar').classList.add('show');
  undoTimer=setTimeout(function(){ document.getElementById('undo-bar').classList.remove('show'); undoItem=null; },4000);
}

async function doUndo() {
  if(!undoItem) return;
  pause(2000);
  var r=await SB.from('shopping_items').insert({store_id:undoItem.store_id,aisle_id:undoItem.aisle_id,name:undoItem.name,quantity:undoItem.quantity,checked:undoItem.checked}).select().single();
  if(r.data) items.push(r.data);
  document.getElementById('undo-bar').classList.remove('show');
  undoItem=null; if(undoTimer) clearTimeout(undoTimer);
  drawAll();
}

// Qty modal
function openQty(id, name, qty) {
  qtyItemId=id;
  document.getElementById('qty-item-name').textContent=name;
  document.getElementById('qty-inp').value=qty;
  document.getElementById('qty-ov').classList.add('open');
  setTimeout(function(){ document.getElementById('qty-inp').select(); },100);
}
async function saveQty() {
  var q=parseInt(document.getElementById('qty-inp').value)||1;
  if(qtyItemId){
    var it=null;
    for(var i=0;i<items.length;i++){ if(items[i].id===qtyItemId){ it=items[i]; break; } }
    if(it){
      pause(2000);
      await SB.from('shopping_items').update({quantity:Math.max(1,q)}).eq('id',qtyItemId);
      it.quantity=Math.max(1,q);
      drawAll();
    }
  }
  document.getElementById('qty-ov').classList.remove('open');
  qtyItemId=null;
}
document.getElementById('qty-ov').addEventListener('click',function(e){ if(e.target===document.getElementById('qty-ov')) document.getElementById('qty-ov').classList.remove('open'); });
document.getElementById('qty-inp').addEventListener('keydown',function(e){ if(e.key==='Enter') saveQty(); });

// Voice
function toggleMic() {
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){ alert('このブラウザは音声入力非対応です'); return; }
  if(isRec){ recog.stop(); return; }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR(); recog.lang='ja-JP';
  recog.onresult=function(e){ var inp=document.getElementById('add-input'); if(inp) inp.value=e.results[0][0].transcript; };
  recog.onend=function(){ isRec=false; var b=document.getElementById('mic-btn'); if(b) b.className=''; };
  recog.start(); isRec=true; var b=document.getElementById('mic-btn'); if(b) b.className='rec';
}

// Overlays
function openOv(id){ document.getElementById(id).classList.add('open'); }
function closeOv(id){ document.getElementById(id).classList.remove('open'); editAisleId=null; editStapleId=null; }
document.querySelectorAll('.ov').forEach(function(el){ el.addEventListener('click',function(e){ if(e.target===el) el.classList.remove('open'); }); });

// Color picker
function drawCP(sel) {
  var h='';
  for(var i=0;i<COLORS.length;i++){
    h+='<div class="csw'+(COLORS[i]===sel?' on':'')+'" style="background:'+COLORS[i]+'" onclick="pickColor(\''+COLORS[i]+'\')"></div>';
  }
  document.getElementById('cp').innerHTML=h;
}
function pickColor(c){ drawCP(c); }
function getColor(){ var el=document.querySelector('.csw.on'); return el?el.style.backgroundColor:COLORS[0]; }

// Aisle
function openAddAisle(sid) {
  aisleStoreId=sid; editAisleId=null;
  document.getElementById('aisle-m-title').textContent='売り場を追加';
  document.getElementById('aisle-name-inp').value='';
  document.getElementById('aisle-sort-inp').value=aisles.filter(function(a){return a.store_id===sid;}).length+1;
  drawCP(COLORS[0]); openOv('aisle-ov');
}
function openEditAisle(id) {
  var a=null; for(var i=0;i<aisles.length;i++){if(aisles[i].id===id){a=aisles[i];break;}}
  if(!a) return;
  editAisleId=id; aisleStoreId=a.store_id;
  document.getElementById('aisle-m-title').textContent='売り場を編集';
  document.getElementById('aisle-name-inp').value=a.name;
  document.getElementById('aisle-sort-inp').value=a.sort_order;
  drawCP(a.color); openOv('aisle-ov');
}
async function saveAisle() {
  var name=document.getElementById('aisle-name-inp').value.trim();
  var sort=parseInt(document.getElementById('aisle-sort-inp').value)||1;
  var color=getColor();
  if(!name) return;
  pause(2000);
  if(editAisleId){
    await SB.from('aisles').update({name:name,color:color,sort_order:sort}).eq('id',editAisleId);
    for(var i=0;i<aisles.length;i++){ if(aisles[i].id===editAisleId){aisles[i].name=name;aisles[i].color=color;aisles[i].sort_order=sort;break;} }
  } else {
    var r=await SB.from('aisles').insert({store_id:aisleStoreId,name:name,color:color,sort_order:sort}).select().single();
    if(r.data){ aisles.push(r.data); aisles.sort(function(a,b){return a.sort_order-b.sort_order;}); }
  }
  closeOv('aisle-ov'); drawAll();
}
async function deleteAisle(id) {
  if(!confirm('この売り場を削除しますか？')) return;
  pause(2000);
  await SB.from('staples').delete().eq('aisle_id',id);
  await SB.from('shopping_items').update({aisle_id:null}).eq('aisle_id',id);
  await SB.from('aisles').delete().eq('id',id);
  staples=staples.filter(function(s){return s.aisle_id!==id;});
  for(var i=0;i<items.length;i++){if(items[i].aisle_id===id) items[i].aisle_id=null;}
  aisles=aisles.filter(function(a){return a.id!==id;});
  drawAll();
}

// Store
async function saveStore() {
  var name=document.getElementById('store-name-inp').value.trim(); if(!name) return;
  pause(2000);
  var r=await SB.from('stores').insert({name:name}).select().single();
  if(r.data){stores.push(r.data); activeStore=r.data.id;}
  closeOv('store-ov'); document.getElementById('store-name-inp').value=''; drawAll();
}
async function deleteStore(id) {
  if(!confirm('このスーパーを削除しますか？')) return;
  pause(2000);
  await SB.from('shopping_items').delete().eq('store_id',id);
  var sa=aisles.filter(function(a){return a.store_id===id;});
  for(var i=0;i<sa.length;i++) await SB.from('staples').delete().eq('aisle_id',sa[i].id);
  await SB.from('aisles').delete().eq('store_id',id);
  await SB.from('stores').delete().eq('id',id);
  items=items.filter(function(i){return i.store_id!==id;});
  sa.forEach(function(a){staples=staples.filter(function(s){return s.aisle_id!==a.id;});});
  aisles=aisles.filter(function(a){return a.store_id!==id;});
  stores=stores.filter(function(s){return s.id!==id;});
  if(activeStore===id) activeStore=stores.length?stores[0].id:null;
  drawAll();
}

// Staples
function openAddStaple() {
  editStapleId=null;
  document.getElementById('staple-m-title').textContent='定番アイテムを追加';
  document.getElementById('staple-name-inp').value='';
  var sel=document.getElementById('staple-aisle-inp');
  sel.innerHTML=''; for(var i=0;i<aisles.length;i++) sel.innerHTML+='<option value="'+aisles[i].id+'">'+aisles[i].name+'</option>';
  document.getElementById('staple-sort-inp').value=1;
  openOv('staple-ov');
}
function openEditStaple(id) {
  var s=null; for(var i=0;i<staples.length;i++){if(staples[i].id===id){s=staples[i];break;}}
  if(!s) return;
  editStapleId=id;
  document.getElementById('staple-m-title').textContent='定番アイテムを編集';
  document.getElementById('staple-name-inp').value=s.name;
  var sel=document.getElementById('staple-aisle-inp');
  sel.innerHTML=''; for(var i=0;i<aisles.length;i++) sel.innerHTML+='<option value="'+aisles[i].id+'"'+(aisles[i].id===s.aisle_id?' selected':'')+'>'+aisles[i].name+'</option>';
  document.getElementById('staple-sort-inp').value=s.sort_order||1;
  openOv('staple-ov');
}
async function saveStaple() {
  var name=document.getElementById('staple-name-inp').value.trim();
  var aid=document.getElementById('staple-aisle-inp').value;
  var sort=parseInt(document.getElementById('staple-sort-inp').value)||1;
  if(!name||!aid) return;
  pause(2000);
  if(editStapleId){
    await SB.from('staples').update({name:name,aisle_id:aid,sort_order:sort}).eq('id',editStapleId);
    for(var i=0;i<staples.length;i++){if(staples[i].id===editStapleId){staples[i].name=name;staples[i].aisle_id=aid;staples[i].sort_order=sort;break;}}
  } else {
    var r=await SB.from('staples').insert({aisle_id:aid,name:name,sort_order:sort}).select().single();
    if(r.data) staples.push(r.data);
  }
  closeOv('staple-ov'); drawAll();
}
async function deleteStaple(id) {
  if(!confirm('この定番アイテムを削除しますか？')) return;
  pause(2000);
  await SB.from('staples').delete().eq('id',id);
  staples=staples.filter(function(s){return s.id!==id;});
  drawAll();
}

// Settings
function drawSettings() {
  var se=document.getElementById('store-settings');
  var ste=document.getElementById('staple-settings');
  var h='';
  for(var i=0;i<stores.length;i++){
    var s=stores[i];
    var sa=aisles.filter(function(a){return a.store_id===s.id;});
    h+='<div class="set-grp"><span style="flex:1">'+s.name+'</span><button class="dbtn" onclick="deleteStore(\''+s.id+'\')">削除</button></div>';
    for(var j=0;j<sa.length;j++){
      var a=sa[j];
      h+='<div class="set-row">';
      h+='<div style="width:10px;height:10px;border-radius:50%;background:'+a.color+';flex-shrink:0"></div>';
      h+='<div class="set-name">'+a.name+'</div>';
      h+='<div class="set-meta">順'+a.sort_order+'</div>';
      h+='<button class="ebtn" onclick="openEditAisle(\''+a.id+'\')">✏️</button>';
      h+='<button class="dbtn" onclick="deleteAisle(\''+a.id+'\')">✕</button>';
      h+='</div>';
    }
    h+='<div class="set-add" onclick="openAddAisle(\''+s.id+'\')">＋ 売り場を追加</div>';
  }
  h+='<div class="set-add" onclick="openOv(\'store-ov\')">＋ スーパーを追加</div>';
  se.innerHTML=h;

  h='';
  for(var i=0;i<aisles.length;i++){
    var a=aisles[i];
    var as=staples.filter(function(s){return s.aisle_id===a.id;}).sort(function(x,y){return (x.sort_order||0)-(y.sort_order||0);});
    if(!as.length) continue;
    h+='<div class="set-grp" style="color:'+a.color+'">';
    h+='<div style="width:8px;height:8px;border-radius:50%;background:'+a.color+';margin-right:6px;flex-shrink:0"></div>'+a.name;
    h+='</div>';
    for(var j=0;j<as.length;j++){
      var s=as[j];
      h+='<div class="set-row"><div class="set-name">'+s.name+'</div><div class="set-meta">順'+(s.sort_order||'-')+'</div>';
      h+='<button class="ebtn" onclick="openEditStaple(\''+s.id+'\')">✏️</button>';
      h+='<button class="dbtn" onclick="deleteStaple(\''+s.id+'\')">✕</button></div>';
    }
  }
  h+='<div class="set-add" onclick="openAddStaple()">＋ 定番アイテムを追加</div>';
  ste.innerHTML=h;
}

document.getElementById('settings-btn').addEventListener('click',function(){
  document.getElementById('main-wrap').classList.add('hide');
  document.getElementById('settings').classList.add('show');
  document.getElementById('hdr-left').innerHTML='';
  document.getElementById('settings-btn').style.display='none';
  drawSettings();
});
document.getElementById('back-btn').addEventListener('click',function(){
  document.getElementById('main-wrap').classList.remove('hide');
  document.getElementById('settings').classList.remove('show');
  document.getElementById('hdr-left').innerHTML='<span id="hdr-title">🛒 買い物リスト</span>';
  document.getElementById('settings-btn').style.display='';
});

boot();
</script>
