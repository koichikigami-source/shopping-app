<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買い物アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border: #e0ddd4;
  --text: #1a1916;
  --text2: #6b6860;
  --text3: #9b9890;
  --accent: #2d5a27;
  --accent-light: #e8f0e7;
  --danger: #c0392b;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: background 0.15s; }
.icon-btn:hover { background: var(--border); }

/* Store tabs */
.store-tabs { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.store-tabs::-webkit-scrollbar { display: none; }
.store-tab { padding: 12px 14px; font-size: 13px; font-weight: 500; color: var(--text2); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; transition: color 0.15s; flex-shrink: 0; }
.store-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.store-tab-add { padding: 12px 10px; color: var(--text3); cursor: pointer; font-size: 18px; flex-shrink: 0; }

/* Main content */
.main { padding: 12px 16px 100px; max-width: 600px; margin: 0 auto; }

/* Quick add */
.quick-add { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
.quick-add-input-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.quick-add-input { flex: 1; border: none; background: transparent; font-size: 15px; font-family: inherit; color: var(--text); outline: none; }
.quick-add-input::placeholder { color: var(--text3); }
.mic-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; transition: background 0.15s; }
.mic-btn.recording { background: #fee; color: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.add-btn { padding: 6px 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; flex-shrink: 0; font-family: inherit; }
.quick-add-meta { display: flex; gap: 8px; padding: 0 12px 10px; }
.meta-select { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 12px; font-family: inherit; color: var(--text); background: var(--surface2); outline: none; }

/* Staples panel */
.staples-toggle { padding: 8px 12px; background: var(--surface2); border-top: 1px solid var(--border); font-size: 12px; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.staples-panel { border-top: 1px solid var(--border); padding: 10px 12px; display: none; }
.staples-panel.open { display: block; }
.staples-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.staples-cat-btn { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--surface); color: var(--text2); transition: all 0.15s; }
.staples-cat-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.staples-items { display: flex; gap: 6px; flex-wrap: wrap; }
.staple-chip { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); font-size: 13px; cursor: pointer; background: var(--surface); color: var(--text); transition: all 0.15s; }
.staple-chip:hover { border-color: var(--accent); color: var(--accent); }

/* Aisle sections */
.aisle-section { margin-bottom: 8px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.aisle-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.aisle-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.aisle-name { font-size: 13px; font-weight: 600; flex: 1; }
.aisle-count { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
.aisle-chevron { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
.aisle-section.collapsed .aisle-chevron { transform: rotate(-90deg); }
.aisle-items { background: var(--surface); }
.aisle-section.collapsed .aisle-items { display: none; }

/* Shopping item */
.shopping-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); transition: background 0.15s; }
.shopping-item.checked { opacity: 0.4; }
.check-circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.check-circle.done { background: var(--accent); border-color: var(--accent); color: white; font-size: 11px; }
.item-name { flex: 1; font-size: 14px; }
.item-name.done { text-decoration: line-through; color: var(--text3); }
.qty-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; line-height: 1; transition: background 0.15s; }
.qty-btn:hover { background: var(--border); }
.qty-num { font-size: 14px; font-family: 'DM Mono', monospace; min-width: 20px; text-align: center; cursor: pointer; }
.delete-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--text3); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
.shopping-item:hover .delete-btn { opacity: 1; }

/* Empty state */
.empty { text-align: center; padding: 48px 24px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

/* FAB */
.fab { position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 16px rgba(45,90,39,0.35); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; z-index: 50; }
.fab:hover { transform: scale(1.05); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; padding: 20px 20px 40px; transform: translateY(20px); transition: transform 0.2s; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.modal-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; background: var(--surface2); }
.modal-input:focus { border-color: var(--accent); }
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
.color-swatch.selected { border-color: var(--text); }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; padding: 11px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; border: 1px solid var(--border); background: var(--surface2); color: var(--text); }
.modal-btn-primary { background: var(--accent); color: white; border-color: var(--accent); }

/* Toast */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 300; }
.toast.show { opacity: 1; }

/* Qty input modal */
.qty-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 250; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
.qty-modal.open { opacity: 1; pointer-events: all; }
.qty-modal-box { background: var(--surface); border-radius: var(--radius); padding: 20px; width: 200px; text-align: center; }
.qty-modal-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.qty-modal-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; font-size: 20px; font-family: 'DM Mono', monospace; text-align: center; outline: none; }
.qty-modal-input:focus { border-color: var(--accent); }
.qty-modal-btn { margin-top: 10px; width: 100%; padding: 9px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; font-family: inherit; }

/* Section header with progress */
.progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 0 14px 8px; }
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* Settings screen */
.settings-screen { display: none; }
.settings-screen.active { display: block; }
.main-screen { display: block; }
.main-screen.hidden { display: none; }
.settings-section { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
.settings-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); cursor: pointer; }
.settings-item:first-child { border-top: none; }
.settings-item-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.settings-item-name { flex: 1; font-size: 14px; }
.settings-item-meta { font-size: 12px; color: var(--text3); }
.settings-add-row { padding: 12px 14px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 500; }
.back-btn { font-size: 13px; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div class="header">
  <div id="headerLeft">
    <div class="header-title">🛒 買い物リスト</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
  </div>
</div>

<!-- Main screen -->
<div class="main-screen" id="mainScreen">
  <div class="store-tabs" id="storeTabs"></div>
  <div class="main" id="mainContent"></div>
</div>

<!-- Settings screen -->
<div class="settings-screen" id="settingsScreen">
  <div class="main" style="padding-top:16px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <div class="back-btn" id="backBtn">← 戻る</div>
      <div style="font-size:16px;font-weight:700;">設定</div>
    </div>

    <div style="font-size:12px;color:var(--text2);margin-bottom:6px;padding-left:4px;">スーパー管理</div>
    <div class="settings-section" id="storeSettings"></div>

    <div style="font-size:12px;color:var(--text2);margin:16px 0 6px;padding-left:4px;">定番リスト管理</div>
    <div class="settings-section" id="stapleSettings"></div>
  </div>
</div>

<!-- Add item modal -->
<div class="modal-overlay" id="aisleModal">
  <div class="modal">
    <div class="modal-title" id="aisleModalTitle">売り場を追加</div>
    <div class="modal-field">
      <div class="modal-label">売り場名</div>
      <input class="modal-input" id="aisleNameInput" placeholder="例：野菜・果物">
    </div>
    <div class="modal-field">
      <div class="modal-label">色</div>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-field">
      <div class="modal-label">並び順（数字が小さいほど上）</div>
      <input class="modal-input" id="aisleSortInput" type="number" placeholder="1" value="1">
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('aisleModal')">キャンセル</button>
      <button class="modal-btn modal-btn-primary" onclick="saveAisle()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="storeModal">
  <div class="modal">
    <div class="modal-title">スーパーを追加</div>
    <div class="modal-field">
      <div class="modal-label">スーパー名</div>
      <input class="modal-input" id="storeNameInput" placeholder="例：業務スーパー">
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('storeModal')">キャンセル</button>
      <button class="modal-btn modal-btn-primary" onclick="saveStore()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="stapleModal">
  <div class="modal">
    <div class="modal-title">定番アイテムを追加</div>
    <div class="modal-field">
      <div class="modal-label">アイテム名</div>
      <input class="modal-input" id="stapleNameInput" placeholder="例：玉ねぎ">
    </div>
    <div class="modal-field">
      <div class="modal-label">売り場</div>
      <select class="modal-input" id="stapleAisleSelect"></select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('stapleModal')">キャンセル</button>
      <button class="modal-btn modal-btn-primary" onclick="saveStaple()">保存</button>
    </div>
  </div>
</div>

<!-- Qty input modal -->
<div class="qty-modal" id="qtyModal">
  <div class="qty-modal-box">
    <div class="qty-modal-title" id="qtyModalTitle">数量を入力</div>
    <input class="qty-modal-input" id="qtyModalInput" type="number" min="1" value="1">
    <button class="qty-modal-btn" onclick="saveQtyModal()">OK</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://pfobhvsslpxuiglfacss.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmb2JodnNzbHB4dWlnbGZhY3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODg4NzIsImV4cCI6MjA5Mjg2NDg3Mn0.yyYgQnDrT2OTgKHsTtNPbNLesMUd_mGYlqZlU6mLZQE';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#795548','#607d8b'];

let stores = [], aisles = [], staples = [], items = [];
let activeStoreId = null;
let editingAisleId = null;
let qtyModalItemId = null;
let recognition = null;
let isRecording = false;
let staplesOpen = false;
let activeStaplesCat = null;

// --- Init ---
async function init() {
  await loadAll();
  setupRealtime();
  render();
}

async function loadAll() {
  const [s, a, st, it] = await Promise.all([
    db.from('stores').select('*'),
    db.from('aisles').select('*').order('sort_order'),
    db.from('staples').select('*'),
    db.from('shopping_items').select('*').order('created_at')
  ]);
  stores = s.data || [];
  aisles = a.data || [];
  staples = st.data || [];
  items = it.data || [];
  if (!activeStoreId && stores.length) activeStoreId = stores[0].id;
}

function setupRealtime() {
  db.channel('shopping').on('postgres_changes', { event: '*', schema: 'public' }, async () => {
    await loadAll();
    render();
  }).subscribe();
}

// --- Render ---
function render() {
  renderStoreTabs();
  renderMain();
  renderSettings();
}

function renderStoreTabs() {
  const el = document.getElementById('storeTabs');
  el.innerHTML = stores.map(s =>
    `<div class="store-tab ${s.id===activeStoreId?'active':''}" onclick="setStore('${s.id}')">${s.name}</div>`
  ).join('') + `<div class="store-tab-add" onclick="openModal('storeModal')">＋</div>`;
}

function renderMain() {
  const el = document.getElementById('mainContent');
  if (!activeStoreId) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🏪</div><div class="empty-text">スーパーを追加してください</div></div>`;
    return;
  }
  const storeAisles = aisles.filter(a => a.store_id === activeStoreId);
  const storeItems = items.filter(i => i.store_id === activeStoreId);
  const storeStaples = staples.filter(s => storeAisles.find(a => a.id === s.aisle_id));

  // Quick add
  let html = `<div class="quick-add">
    <div class="quick-add-input-row">
      <input class="quick-add-input" id="quickInput" placeholder="アイテムを追加..." onkeydown="if(event.key==='Enter')quickAdd()">
      <button class="mic-btn ${isRecording?'recording':''}" id="micBtn" onclick="toggleMic()" title="音声入力">🎤</button>
      <button class="add-btn" onclick="quickAdd()">追加</button>
    </div>
    <div class="quick-add-meta">
      <select class="meta-select" id="quickAisle">
        <option value="">売り場を選択</option>
        ${storeAisles.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
      </select>
    </div>
    <div class="staples-toggle" onclick="toggleStaples()">
      <span>定番リストから追加</span>
      <span id="staplesArrow">${staplesOpen?'▲':'▼'}</span>
    </div>
    <div class="staples-panel ${staplesOpen?'open':''}" id="staplesPanel">
      <div class="staples-cats">
        <div class="staples-cat-btn ${activeStaplesCat===null?'active':''}" onclick="setStaplesCat(null)">すべて</div>
        ${storeAisles.map(a=>`<div class="staples-cat-btn ${activeStaplesCat===a.id?'active':''}" onclick="setStaplesCat('${a.id}')" style="border-color:${a.color}20;${activeStaplesCat===a.id?`background:${a.color};color:white;border-color:${a.color}`:'color:'+a.color}">${a.name}</div>`).join('')}
      </div>
      <div class="staples-items">
        ${storeStaples.filter(s=>activeStaplesCat===null||s.aisle_id===activeStaplesCat).map(s=>
          `<div class="staple-chip" onclick="addStaple('${s.id}')">${s.name}</div>`
        ).join('')}
        ${storeStaples.filter(s=>activeStaplesCat===null||s.aisle_id===activeStaplesCat).length===0?'<span style="color:var(--text3);font-size:13px;">定番アイテムがありません</span>':''}
      </div>
    </div>
  </div>`;

  // Items by aisle
  if (storeItems.length === 0) {
    html += `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">リストは空です</div></div>`;
  } else {
    // Items with aisle
    storeAisles.forEach(aisle => {
      const aisleItems = storeItems.filter(i => i.aisle_id === aisle.id);
      if (!aisleItems.length) return;
      const checked = aisleItems.filter(i=>i.checked).length;
      const pct = aisleItems.length ? (checked/aisleItems.length*100) : 0;
      html += `<div class="aisle-section" id="aisle-${aisle.id}">
        <div class="aisle-header" style="background:${aisle.color}14;" onclick="toggleAisle('${aisle.id}')">
          <div class="aisle-dot" style="background:${aisle.color}"></div>
          <div class="aisle-name">${aisle.name}</div>
          <div class="aisle-count">${checked}/${aisleItems.length}</div>
          <div class="aisle-chevron">▾</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${aisle.color}"></div></div>
        <div class="aisle-items">
          ${aisleItems.map(item => renderItem(item)).join('')}
        </div>
      </div>`;
    });

    // Items without aisle
    const noAisle = storeItems.filter(i => !i.aisle_id);
    if (noAisle.length) {
      html += `<div class="aisle-section" id="aisle-none">
        <div class="aisle-header" style="background:#f0f0f0;" onclick="toggleAisle('none')">
          <div class="aisle-dot" style="background:#999"></div>
          <div class="aisle-name">未分類</div>
          <div class="aisle-count">${noAisle.length}</div>
          <div class="aisle-chevron">▾</div>
        </div>
        <div class="aisle-items">${noAisle.map(item => renderItem(item)).join('')}</div>
      </div>`;
    }
  }

  el.innerHTML = html;
}

function renderItem(item) {
  return `<div class="shopping-item ${item.checked?'checked':''}" id="item-${item.id}">
    <div class="check-circle ${item.checked?'done':''}" onclick="toggleCheck('${item.id}')">${item.checked?'✓':''}</div>
    <div class="item-name ${item.checked?'done':''}">${item.name}</div>
    <div class="qty-ctrl">
      <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
      <div class="qty-num" onclick="openQtyModal('${item.id}','${item.name}',${item.quantity})">${item.quantity}</div>
      <button class="qty-btn" onclick="changeQty('${item.id}',1)">＋</button>
    </div>
    <button class="delete-btn" onclick="deleteItem('${item.id}')">✕</button>
  </div>`;
}

function renderSettings() {
  const storeEl = document.getElementById('storeSettings');
  const stapleEl = document.getElementById('stapleSettings');
  if (!storeEl || !stapleEl) return;

  storeEl.innerHTML = stores.map(s => {
    const storeAisles = aisles.filter(a => a.store_id === s.id);
    return `<div style="border-top:1px solid var(--border);">
      <div style="padding:10px 14px;font-size:13px;font-weight:600;background:var(--surface2);">${s.name}</div>
      ${storeAisles.map(a => `
        <div class="settings-item" onclick="openEditAisle('${a.id}')">
          <div class="settings-item-dot" style="background:${a.color}"></div>
          <div class="settings-item-name">${a.name}</div>
          <div class="settings-item-meta">順番 ${a.sort_order}</div>
          <div style="color:var(--text3);font-size:12px;">✏️</div>
        </div>`).join('')}
      <div class="settings-add-row" onclick="openAddAisle('${s.id}')">＋ 売り場を追加</div>
    </div>`;
  }).join('') + `<div class="settings-add-row" onclick="openModal('storeModal')">＋ スーパーを追加</div>`;

  stapleEl.innerHTML = aisles.map(a => {
    const aStaples = staples.filter(s => s.aisle_id === a.id);
    if (!aStaples.length) return '';
    return `<div style="border-top:1px solid var(--border);">
      <div style="padding:8px 14px;font-size:12px;font-weight:600;color:${a.color};background:${a.color}12;">${a.name}</div>
      ${aStaples.map(s => `
        <div class="settings-item">
          <div class="settings-item-name" style="font-size:13px;">${s.name}</div>
          <button style="border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;" onclick="deleteStaple('${s.id}')">✕</button>
        </div>`).join('')}
    </div>`;
  }).join('') + `<div class="settings-add-row" onclick="openAddStaple()">＋ 定番アイテムを追加</div>`;
}

// --- Actions ---
function setStore(id) {
  activeStoreId = id;
  render();
}

async function quickAdd() {
  const input = document.getElementById('quickInput');
  const aisleSelect = document.getElementById('quickAisle');
  const name = input.value.trim();
  if (!name || !activeStoreId) return;
  await db.from('shopping_items').insert({
    store_id: activeStoreId,
    aisle_id: aisleSelect.value || null,
    name,
    quantity: 1,
    checked: false
  });
  input.value = '';
  showToast(`「${name}」を追加しました`);
}

async function addStaple(stapleId) {
  const staple = staples.find(s => s.id === stapleId);
  if (!staple || !activeStoreId) return;
  const existing = items.find(i => i.store_id === activeStoreId && i.name === staple.name && !i.checked);
  if (existing) {
    await db.from('shopping_items').update({ quantity: existing.quantity + 1 }).eq('id', existing.id);
  } else {
    await db.from('shopping_items').insert({
      store_id: activeStoreId,
      aisle_id: staple.aisle_id,
      name: staple.name,
      quantity: 1,
      checked: false
    });
  }
  showToast(`「${staple.name}」を追加しました`);
}

async function toggleCheck(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  await db.from('shopping_items').update({ checked: !item.checked }).eq('id', id);
}

async function changeQty(id, delta) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const newQty = Math.max(1, item.quantity + delta);
  await db.from('shopping_items').update({ quantity: newQty }).eq('id', id);
}

async function deleteItem(id) {
  await db.from('shopping_items').delete().eq('id', id);
}

function openQtyModal(id, name, qty) {
  qtyModalItemId = id;
  document.getElementById('qtyModalTitle').textContent = name;
  document.getElementById('qtyModalInput').value = qty;
  document.getElementById('qtyModal').classList.add('open');
  setTimeout(() => document.getElementById('qtyModalInput').select(), 100);
}

async function saveQtyModal() {
  const qty = parseInt(document.getElementById('qtyModalInput').value) || 1;
  if (qtyModalItemId) {
    await db.from('shopping_items').update({ quantity: Math.max(1, qty) }).eq('id', qtyModalItemId);
  }
  document.getElementById('qtyModal').classList.remove('open');
  qtyModalItemId = null;
}

document.getElementById('qtyModal').addEventListener('click', e => {
  if (e.target === document.getElementById('qtyModal')) document.getElementById('qtyModal').classList.remove('open');
});
document.getElementById('qtyModalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveQtyModal();
});

// --- Voice input ---
function toggleMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    showToast('このブラウザは音声入力に対応していません');
    return;
  }
  if (isRecording) {
    recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.onresult = e => {
    document.getElementById('quickInput').value = e.results[0][0].transcript;
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.start();
  isRecording = true;
  document.getElementById('micBtn').classList.add('recording');
}

// --- Staples panel ---
function toggleStaples() {
  staplesOpen = !staplesOpen;
  renderMain();
}

function setStaplesCat(id) {
  activeStaplesCat = id;
  renderMain();
}

// --- Aisle collapse ---
function toggleAisle(id) {
  const el = document.getElementById(`aisle-${id}`);
  if (el) el.classList.toggle('collapsed');
}

// --- Modal helpers ---
function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  editingAisleId = null;
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.remove('open');
  });
});

// --- Aisle modal ---
let aisleModalStoreId = null;

function openAddAisle(storeId) {
  aisleModalStoreId = storeId;
  editingAisleId = null;
  document.getElementById('aisleModalTitle').textContent = '売り場を追加';
  document.getElementById('aisleNameInput').value = '';
  document.getElementById('aisleSortInput').value = aisles.filter(a=>a.store_id===storeId).length + 1;
  renderColorPicker(COLORS[0]);
  openModal('aisleModal');
}

function openEditAisle(id) {
  const aisle = aisles.find(a => a.id === id);
  if (!aisle) return;
  editingAisleId = id;
  aisleModalStoreId = aisle.store_id;
  document.getElementById('aisleModalTitle').textContent = '売り場を編集';
  document.getElementById('aisleNameInput').value = aisle.name;
  document.getElementById('aisleSortInput').value = aisle.sort_order;
  renderColorPicker(aisle.color);
  openModal('aisleModal');
}

function renderColorPicker(selected) {
  document.getElementById('colorPicker').innerHTML = COLORS.map(c =>
    `<div class="color-swatch ${c===selected?'selected':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
  ).join('');
}

function selectColor(c) {
  renderColorPicker(c);
}

async function saveAisle() {
  const name = document.getElementById('aisleNameInput').value.trim();
  const sort = parseInt(document.getElementById('aisleSortInput').value) || 1;
  const color = document.querySelector('.color-swatch.selected')?.style.backgroundColor || COLORS[0];
  if (!name) return;
  if (editingAisleId) {
    await db.from('aisles').update({ name, color, sort_order: sort }).eq('id', editingAisleId);
  } else {
    await db.from('aisles').insert({ store_id: aisleModalStoreId, name, color, sort_order: sort });
  }
  closeModal('aisleModal');
  await loadAll();
  render();
  showToast(editingAisleId ? '売り場を更新しました' : '売り場を追加しました');
}

// --- Store modal ---
async function saveStore() {
  const name = document.getElementById('storeNameInput').value.trim();
  if (!name) return;
  const res = await db.from('stores').insert({ name }).select().single();
  if (res.data) activeStoreId = res.data.id;
  closeModal('storeModal');
  document.getElementById('storeNameInput').value = '';
  await loadAll();
  render();
  showToast(`「${name}」を追加しました`);
}

// --- Staple modal ---
function openAddStaple() {
  const select = document.getElementById('stapleAisleSelect');
  select.innerHTML = aisles.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  document.getElementById('stapleNameInput').value = '';
  openModal('stapleModal');
}

async function saveStaple() {
  const name = document.getElementById('stapleNameInput').value.trim();
  const aisleId = document.getElementById('stapleAisleSelect').value;
  if (!name || !aisleId) return;
  await db.from('staples').insert({ aisle_id: aisleId, name });
  closeModal('stapleModal');
  await loadAll();
  render();
  showToast(`「${name}」を定番リストに追加しました`);
}

async function deleteStaple(id) {
  await db.from('staples').delete().eq('id', id);
}

// --- Settings screen ---
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('settingsScreen').classList.add('active');
  document.getElementById('headerLeft').innerHTML = '';
  document.getElementById('settingsBtn').style.display = 'none';
  renderSettings();
});

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('settingsScreen').classList.remove('active');
  document.getElementById('headerLeft').innerHTML = '<div class="header-title">🛒 買い物リスト</div>';
  document.getElementById('settingsBtn').style.display = '';
});

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

init();
</script>
</body>
</html>
